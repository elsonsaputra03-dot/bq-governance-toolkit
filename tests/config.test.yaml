project: demo-project
location: US
datasets: [gov_raw, gov_staging, gov_mart]
lookback_days: 30
finops: {expensive_query_usd: 0.0001, partition_min_gib: 0.01, cluster_min_gib: 0.01, pipeline_label: pipeline, unused_days: 30}
dq:
  - table: gov_mart.daily_sales
    freshness_hours: [26, 50]
    min_rows: 100
    not_null: [order_date, revenue]
    null_pct: [0.1, 1.0]
    unique_key: [order_date, category]
  - table: gov_mart.customer_ltv
    freshness_hours: [26, 50]
    not_null: [user_id]
    unique_key: [user_id]
describe: {provider: none}
