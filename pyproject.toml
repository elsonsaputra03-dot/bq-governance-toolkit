[project]
name = "bq-governance-toolkit"
version = "0.1.0"
description = "BigQuery governance and FinOps toolkit: storage, cost, lineage, data dictionary, data quality, and AI-suggested descriptions from INFORMATION_SCHEMA."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["google-cloud-bigquery>=3.20", "pyyaml>=6.0"]

[project.optional-dependencies]
ai = ["google-genai>=1.0", "requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
bqgov = "bqgov.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bqgov"]
